name: Build & release macOS app

on:
  push:
    branches: [main]
    paths: ["main.py", "ks_data.py", "admin.py", "build_mac.sh", "fix_webengine.sh", "requirements.txt", ".github/workflows/release.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon (arm64) — macos-13 (Intel) artık kullanılamıyor
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read APP_VERSION from main.py
        id: ver
        run: |
          v=$(python3 -c "import re; print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', open('main.py', encoding='utf-8').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .icns from club logo
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size kocaelispor_logo.png --out "icon.iconset/icon_${size}x${size}.png"
            double=$((size*2))
            sips -z $double $double kocaelispor_logo.png --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build apps with PyInstaller
        if: steps.check.outputs.skip == 'false'
        run: |
          DATA=(--add-data "kocaelispor_logo.png:." --add-data "ksmedya_logo.png:.")
          [ -d fonts ] && DATA+=(--add-data "fonts:fonts")
          pyinstaller --noconfirm --clean --windowed --onedir --name MediaStaffKS \
            --icon icon.icns --osx-bundle-identifier tr.kocaelispor.mediastaffks \
            "${DATA[@]}" \
            --collect-data certifi --hidden-import certifi \
            --collect-all insightface --collect-all onnxruntime \
            --hidden-import PyQt6.QtWebEngineWidgets --hidden-import PyQt6.QtWebEngineCore \
            --exclude-module tkinter \
            main.py
          bash fix_webengine.sh dist/MediaStaffKS.app python3
          pyinstaller --noconfirm --windowed --onedir --name MediaStaffKS-Admin \
            --icon icon.icns --osx-bundle-identifier tr.kocaelispor.mediastaffks.admin \
            "${DATA[@]}" --exclude-module tkinter \
            admin.py

      - name: Smoke test packaged app (must pass before release)
        if: steps.check.outputs.skip == 'false'
        env:
          QT_QPA_PLATFORM: offscreen
          MEDIASTAFF_DATA: ${{ runner.temp }}/mediastaff-data
        run: |
          dist/MediaStaffKS.app/Contents/MacOS/MediaStaffKS --selftest

      - name: Zip app bundles
        if: steps.check.outputs.skip == 'false'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MediaStaffKS.app MediaStaffKS-mac.zip
          ditto -c -k --sequesterRsrc --keepParent MediaStaffKS-Admin.app MediaStaffKS-Admin-mac.zip

      - name: Tag and create GitHub release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/MediaStaffKS-mac.zip dist/MediaStaffKS-Admin-mac.zip \
            --title "MediaStaffKS ${{ steps.ver.outputs.tag }}" \
            --generate-notes
